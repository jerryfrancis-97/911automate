name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "api/**"
      - "tests/**"
      - "scripts/**"
      - "eval/**"
      - "*.py"
      - "requirements.txt"
      - "pytest.ini"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "src/**"
      - "api/**"
      - "tests/**"
      - "scripts/**"
      - "eval/**"
      - "*.py"
      - "requirements.txt"
      - "pytest.ini"
      - "Dockerfile"
      - ".github/workflows/ci.yml"

jobs:
  lint:
    name: Lint (yapf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install yapf
        run: pip install yapf

      - name: Check formatting
        run: yapf --diff --recursive src/ api/ tests/

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-asyncio

      - name: Run unit tests
        # Only run tests that are fully mocked and require no external services
        # (Qdrant, sentence-transformers model downloads, Ollama, network).
        # Integration tests live in the other test_*.py files and are skipped here.
        run: |
            pytest \
            tests/test_agent.py \
            tests/test_guardrails.py \
            tests/test_config.py \
            tests/test_chunking.py \
            tests/test_logging_setup.py \
            tests/test_cli.py \
            tests/test_session_state.py \
            tests/test_observability.py \
            tests/test_qdrant_schema.py \
            tests/test_idempotent_ingestion.py \
            tests/test_api.py \
            -v
