name: Prompt Eval (DeepEval)

on:
  push:
    branches: ["**"]
    paths:
      - "prompts/**"
      - "eval/**"
      - "eval_dataset/**"
  pull_request:
    branches: ["**"]
    paths:
      - "prompts/**"
      - "eval/**"
      - "eval_dataset/**"

jobs:
  eval:
    name: Prompt evaluation (DeepEval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DeepEval prompt evals (Gemini base + judge)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python eval/run_eval_ci.py

