# Qdrant and Ollama for 911automate. App expects localhost:6333 and localhost:11434 (see config.yml / Config).
# If you run the app in Docker too, set QDRANT_URL=http://qdrant:6333 and OLLAMA_URL=http://ollama:11434.
version: "3.11"

services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: "http://qdrant:6333"
      OLLAMA_URL: "http://ollama:11434"
      CONFIG_PATH: "/app/config.yml"
    volumes:
      - ./src:/app/src
      - ./api:/app/api
      - ./prompts:/app/prompts
      - ./config.yml:/app/config.yml
      - ./data:/app/data
      - ./logs:/app/logs
      - ./rag_logs:/app/rag_logs
    depends_on:
      - qdrant
      - ollama

  streamlit:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_URL: "http://api:8000"
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
      - ./streamlit_helpers.py:/app/streamlit_helpers.py
      - ./assets:/app/assets
    depends_on:
      - api

  cli:
    build: .
    entrypoint: ["python", "-m", "src.rag.cli"]
    environment:
      QDRANT_URL: "http://qdrant:6333"
      OLLAMA_URL: "http://ollama:11434"
      CONFIG_PATH: "/app/config.yml"
    volumes:
      - ./src:/app/src
      - ./api:/app/api
      - ./prompts:/app/prompts
      - ./config.yml:/app/config.yml
      - ./data:/app/data
      - ./logs:/app/logs
      - ./rag_logs:/app/rag_logs
    depends_on:
      - qdrant
      - ollama

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-time init job to pull required models into the persistent ollama_data volume.
  # Safe to re-run; pulls are idempotent.
  ollama-init:
    image: ollama/ollama
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      set -e;
      for i in $(seq 1 60); do
        if ollama list >/dev/null 2>&1; then break; fi;
        echo "Waiting for Ollama...";
        sleep 2;
      done;
      ollama pull llama3.2;
      ollama pull nomic-embed-text:latest;
      echo "Ollama models ready."

volumes:
  qdrant_storage:
  ollama_data:
