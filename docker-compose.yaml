# Qdrant and Ollama for 911automate. App expects localhost:6333 and localhost:11434 (see config.yml / Config).
# If you run the app in Docker too, set QDRANT_URL=http://qdrant:6333 and OLLAMA_URL=http://ollama:11434.
version: "3.11"

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  qdrant_storage:
  ollama_data:
